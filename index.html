<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeTrack | Login</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="container">
    <main>
      <h1 class="brand">CodeTrack</h1>
      <p class="subtitle">Practice. Track. Improve. A beginner-friendly coding platform built with HTML, CSS, and vanilla JavaScript.</p>
      <div class="form-row" id="authTabs">
        <button type="button" id="loginTab" class="button-primary">Login</button>
        <button type="button" id="signupTab" class="button-secondary">Create Account</button>
      </div>
      <form id="authForm">
        <div class="form-row" id="nameGroup" style="display:none;">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name">
        </div>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Minimum 6 characters" autocomplete="current-password" required>
        </div>
        <button type="submit" id="authSubmit" class="button-primary">Login</button>
      </form>
      <button id="demoSignIn" class="small-button">Continue as Demo</button>
      <p class="message" id="authMessage"></p>
      <p class="footer-note">Demo authentication only. Replace with backend authentication before using this application in production.</p>
    </main>
  </div>
  <script src="js/state.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/auth.js" defer></script>
</body>
</html>
